<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Franjinha Lava Rápido – Agende sua lavagem</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700;800&display=swap">
<style>
:root{--bg:#06090e;--card:#0c131c;--ln:#1c2a3a;--tx:#f2f6fa;--mut:#8497aa;--pri:#1e90ff;--pri2:#5cc0ff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
html{scroll-behavior:smooth}
*{box-sizing:border-box}
body{margin:0;background-color:var(--bg);background-image:repeating-linear-gradient(135deg,transparent 0 22px,rgba(255,255,255,.02) 22px 23px);color:var(--tx);font-family:Barlow,system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:60}
.cond,h1,h2,h3,.btn,b{font-family:"Barlow Condensed",Impact,"Arial Narrow",sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:0 18px}
nav{border-bottom:1px solid var(--ln);text-align:center;padding:14px 0;font:700 1.05rem "Barlow Condensed",sans-serif;letter-spacing:3px;text-transform:uppercase}
nav span{color:var(--pri)}
.hero{position:relative;text-align:center;padding:42px 0 54px;overflow:hidden}
.hero::before{content:"";position:absolute;left:-10%;width:120%;top:118px;height:80px;background:var(--pri);transform:rotate(-4deg)}
.hero .wrap{position:relative}
.logo{width:224px;height:224px;margin:0 auto;border-radius:50%;background:#000;border:4px solid #fff;box-shadow:0 0 0 6px var(--pri),0 22px 50px rgba(0,0,0,.6);display:grid;place-items:center;overflow:hidden;animation:pop 1.1s cubic-bezier(.22,1,.36,1) both}
.logo img{width:88%;height:88%;object-fit:contain}
@keyframes pop{from{opacity:0;transform:translateY(18px) scale(.9)}}
.logo{will-change:transform,opacity;backface-visibility:hidden}
h1{font-weight:800;font-size:clamp(2.3rem,9vw,3.8rem);line-height:.95;text-transform:uppercase;margin:34px 0 12px;letter-spacing:.5px;animation:up .8s .25s both}
h1 em{font-style:normal;color:var(--pri2)}
.sub{color:var(--mut);max-width:430px;margin:0 auto 22px;animation:up .8s .4s both}
@keyframes up{from{opacity:0;transform:translateY(16px)}}
.btn{display:inline-block;border:0;cursor:pointer;text-decoration:none;color:#fff;font-weight:800;font-size:1.1rem;letter-spacing:1.5px;text-transform:uppercase;padding:13px 28px;border-radius:6px;background:var(--pri);transition:transform .2s,background .2s}
.btn:hover{transform:translateY(-2px);background:#3aa2ff}
.btn.ghost{background:transparent;border:2px solid var(--pri2);color:var(--pri2)}
section{padding:46px 0 30px}
.tag{color:var(--pri);font:700 .9rem "Barlow Condensed",sans-serif;letter-spacing:3px;text-transform:uppercase}
h2{font-weight:800;font-size:clamp(1.9rem,6vw,2.6rem);text-transform:uppercase;line-height:1;margin:4px 0 22px}
.vrow{background:var(--card);border:1px solid var(--ln);border-left:4px solid var(--pri);border-radius:6px;padding:18px;margin-bottom:14px}
.vh{display:flex;align-items:center;gap:16px}
.vh>div{min-width:0}.vh svg{width:min(150px,34vw);height:auto;color:var(--pri2);flex:none}.vh .car{width:min(105px,26vw);height:auto;aspect-ratio:16/9;flex:none;display:block}.vh small{display:block;font:600 .78rem Barlow,sans-serif;letter-spacing:1.5px;text-transform:uppercase;color:var(--mut);margin-top:4px}
.vh h3{margin:0;font-weight:800;font-size:clamp(1.15rem,5.2vw,1.8rem);text-transform:uppercase;line-height:1}
.pp{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.pr{display:block;width:100%;text-align:left;background:var(--bg);border:1.5px solid var(--ln);border-radius:6px;padding:10px 14px;color:var(--tx);cursor:pointer;font-family:inherit;outline:none;-webkit-tap-highlight-color:transparent;transition:border-color .25s,background .25s,transform .15s}
.pr span{display:block;font:600 .78rem Barlow,sans-serif;letter-spacing:1.5px;text-transform:uppercase;color:var(--mut)}
.pr small{display:block;font-size:.68rem;color:var(--mut);margin-top:5px}
.pr b{font-weight:800;font-size:2.1rem;line-height:1}
.pr.full{grid-column:1/-1}.pr:hover{border-color:var(--pri)}.pr:active{transform:scale(.98)}
.pr.on{border-color:var(--pri);background:rgba(30,144,255,.14)}.pr.on b,.pr.on span{color:var(--pri2)}
.strip{background:var(--pri);color:#fff;transform:skewX(-8deg);padding:14px 18px;margin:26px 8px 0;text-align:center;font:800 clamp(1.1rem,4.5vw,1.5rem) "Barlow Condensed",sans-serif;text-transform:uppercase;letter-spacing:1px}
.strip span{display:inline-block;transform:skewX(8deg)}
.pnl{display:grid;grid-template-rows:0fr;transition:grid-template-rows .45s ease}
.open .pnl{grid-template-rows:1fr}.pin{overflow:hidden;min-height:0}
label{display:block;font:600 .78rem Barlow,sans-serif;letter-spacing:1.5px;text-transform:uppercase;margin:16px 0 7px;color:var(--mut)}
input{width:100%;padding:12px;border:1.5px solid var(--ln);border-radius:6px;background:var(--bg);color:var(--tx);font:500 1rem Barlow,system-ui,sans-serif}
input:focus{outline:0;border-color:var(--pri)}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.sl{padding:10px 0;border:1.5px solid var(--ln);border-radius:6px;background:var(--bg);color:var(--tx);font:700 1rem "Barlow Condensed",sans-serif;letter-spacing:.5px;cursor:pointer;transition:all .2s;-webkit-tap-highlight-color:transparent}
.sl:hover:not(:disabled){border-color:var(--pri)}
.sl.on{background:var(--pri);border-color:var(--pri);color:#fff}
.sl:disabled{opacity:.28;cursor:not-allowed}
.chk{display:flex;gap:10px;align-items:center;margin:16px 0 0;padding:12px;border:1.5px solid var(--ln);border-radius:6px;cursor:pointer;font:600 .95rem Barlow,sans-serif;letter-spacing:0;text-transform:none;color:var(--tx)}
.chk input{width:20px;height:20px;padding:0;accent-color:var(--pri)}
.total{display:flex;justify-content:space-between;align-items:center;margin-top:18px;padding:12px 14px;border-radius:6px;background:rgba(30,144,255,.1);border:1px solid rgba(30,144,255,.35);font-weight:600}
.total small{display:block;color:var(--mut);font-size:.7rem}
.total b{font-size:2.2rem;font-weight:800;color:var(--pri2);line-height:1}
.go{display:block;width:100%;text-align:center;margin-top:16px}
.err{color:#ff7b7b;font-size:.85rem;min-height:1.2em;margin-top:8px}
footer{text-align:center;color:var(--mut);font-size:.8rem;padding:34px 18px 90px}
.wa{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:70;display:flex;align-items:center;justify-content:center;width:60px;height:60px;border-radius:50%;background:#25d366;box-shadow:0 8px 24px rgba(37,211,102,.4);transition:transform .2s;-webkit-tap-highlight-color:transparent}
.wa:hover{transform:scale(1.08)}
.js .rv{opacity:0;transform:translateY(24px);transition:opacity .6s,transform .6s}
.js .rv.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.js .rv{opacity:1;transform:none}html{scroll-behavior:auto}}
.inc{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.ibox{background:var(--card);border:1px solid var(--ln);border-radius:6px;padding:18px}
.ibox.hot{border-color:var(--pri)}
.ibox h3{margin:0 0 10px;font-weight:800;font-size:1.5rem;text-transform:uppercase}
.ibox ul{list-style:none;margin:0;padding:0}
.ibox li{padding:8px 0 8px 28px;border-top:1px solid var(--ln);position:relative}
.ibox li::before{content:"\2713";position:absolute;left:4px;color:var(--pri2);font-weight:700}
.ibox li.wax{background:rgba(30,144,255,.14);margin:6px -8px 0;padding-left:36px;border-radius:4px;border-top:0;font-weight:600;color:var(--pri2)}
.ibox li.wax::before{left:12px}
.il{margin:0;font-size:.78rem;color:var(--mut);line-height:1.5}.il .wax{display:inline-block;margin-top:6px;color:var(--pri2);font-weight:600;background:rgba(30,144,255,.14);padding:2px 8px;border-radius:4px;animation:up .4s both}
.cell{display:flex;flex-direction:column}.cell .pr{flex:1;border-bottom-left-radius:0;border-bottom-right-radius:0}
.promo{background:#e11d1d;color:#fff;padding:10px;border-radius:0 0 6px 6px;text-align:center;font:800 clamp(1.05rem,4.6vw,1.45rem)/1.05 "Barlow Condensed",Impact,sans-serif;text-transform:uppercase;box-shadow:0 6px 16px rgba(225,29,29,.35)}
.promo i{display:block;font-style:normal;background:#ffe600;color:#c40000;font-size:.82rem;letter-spacing:2px;padding:3px 6px;margin:-10px -10px 8px}
.pr,.sl,.btn{position:relative;overflow:hidden}
.rip{position:absolute;border-radius:50%;background:rgba(92,192,255,.4);transform:scale(0);animation:rip .6s ease-out forwards;pointer-events:none}
@keyframes rip{to{transform:scale(3.2);opacity:0}}
@keyframes pick{0%{transform:scale(.94)}55%{transform:scale(1.04)}100%{transform:scale(1)}}
.pr.on,.sl.on{animation:pick .35s ease}
.pin{opacity:0;transform:translateY(-10px);transition:opacity .35s .1s,transform .35s .1s}
.open .pin{opacity:1;transform:none}
.js .vrow.rv{transition:opacity .6s,transform .6s,border-color .3s,box-shadow .3s}
.vrow.open{border-color:rgba(30,144,255,.55);box-shadow:0 14px 34px rgba(0,0,0,.4),0 0 0 1px rgba(30,144,255,.2)}
.bump{animation:bump .45s ease}
@keyframes bump{40%{transform:scale(1.2)}}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
#intro{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;animation:introOut .6s 2.3s forwards}
@keyframes introOut{to{opacity:0;visibility:hidden;pointer-events:none}}
.ilogo{width:200px;height:200px;border-radius:50%;background:#000;border:4px solid #fff;box-shadow:0 0 0 6px var(--pri),0 0 70px rgba(30,144,255,.55);display:grid;place-items:center;overflow:hidden;animation:spin 1.7s cubic-bezier(.2,.8,.2,1) both}
.ilogo img{width:88%;height:88%;object-fit:contain}
@keyframes spin{0%{transform:rotate(-720deg) scale(.05);opacity:0}60%{opacity:1}100%{transform:rotate(0) scale(1)}}
#intro p{margin:0;font:800 1.7rem "Barlow Condensed",Impact,sans-serif;letter-spacing:4px;text-transform:uppercase;animation:up .6s 1.4s both}
#intro p span{color:var(--pri)}
.js .logo{animation-delay:2.3s}.js h1{animation-delay:2.55s}.js .sub{animation-delay:2.7s}
@media (prefers-reduced-motion:reduce){#intro{display:none!important}.js .logo,.js h1,.js .sub{animation-delay:0s}}
</style>
</head>
